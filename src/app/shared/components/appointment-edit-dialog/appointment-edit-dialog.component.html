
    <h2 mat-dialog-title>{{ data.title }}</h2>
    <mat-dialog-content>
      <form class="dialog-form" [formGroup]="form">
        <div class="grid two-up">
          <mat-form-field appearance="outline">
            <mat-label>Date</mat-label>
            <input matInput type="date" formControlName="date">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Time</mat-label>
            <mat-select formControlName="slotId">
              @for (slot of data.timeSlots; track slot.value) {
                <mat-option [value]="slot.value">{{ slot.label }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>

        @if (data.canEditStatus) {
          <mat-form-field appearance="outline">
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
              <mat-option value="PENDING">PENDING</mat-option>
              <mat-option value="CONFIRMED">CONFIRMED</mat-option>
              <mat-option value="CANCELLED">CANCELLED</mat-option>
              <mat-option value="COMPLETED">COMPLETED</mat-option>
              <mat-option value="NO_SHOW">NO_SHOW</mat-option>
            </mat-select>
          </mat-form-field>
        }

        <mat-form-field appearance="outline">
          <mat-label>Patient notes</mat-label>
          <textarea matInput rows="4" formControlName="notes"></textarea>
        </mat-form-field>

        @if (data.canEditInternalNotes) {
          <mat-form-field appearance="outline">
            <mat-label>Internal notes</mat-label>
            <textarea matInput rows="4" formControlName="internalNotes"></textarea>
          </mat-form-field>
        }
      </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-stroked-button type="button" (click)="dialogRef.close()">Close</button>
      <button mat-flat-button color="primary" type="button" (click)="save()">Save changes</button>
    </mat-dialog-actions>
